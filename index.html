<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at top, #252525 0%, #111 45%, #080808 100%);
            font-family: Arial, sans-serif;
        }

        .download-btn {
            position: relative;
            padding: 18px 42px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(180deg, #4f9cff 0%, #1769d5 100%);
            color: white;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;

            box-shadow:
                0 7px 0 #0b3c82,
                0 12px 25px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);

            transition:
                transform 0.08s ease,
                box-shadow 0.08s ease,
                filter 0.15s ease;
        }

        .download-btn::before {
            content: "";
            position: absolute;
            top: 2px;
            left: 8px;
            right: 8px;
            height: 40%;
            border-radius: 9px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0.22),
                rgba(255, 255, 255, 0)
            );
            pointer-events: none;
        }

        .download-btn:hover {
            filter: brightness(1.1);
            box-shadow:
                0 7px 0 #0b3c82,
                0 15px 32px rgba(0, 0, 0, 0.65),
                0 0 20px rgba(50, 140, 255, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }

        .download-btn:active {
            transform: translateY(7px);
            box-shadow:
                0 0 0 #0b3c82,
                0 5px 12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }
    </style>
</head>

<body>

    <button class="download-btn" id="download">
        Download
    </button>

    <script>
        document.getElementById("download").addEventListener("click", () => {
            const link = document.createElement("a");

            link.href = "bypass.bat";
            link.download = "bypass.bat";

            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => {
                window.close();
            }, 300);
        });
    </script>

</body>
</html>
